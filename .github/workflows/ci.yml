name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Install Wine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wine64
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Integration (real Wine, headless)
        run: |
          export WINEPREFIX="$RUNNER_TEMP/bottle-ci"
          export WINEDEBUG=fixme-all
          timeout 120 wine64 wineboot --init
          timeout 60 wine64 cmd /c echo bottle-alive
  macos-arm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build WineKit (compile-only proof on real macOS)
        run: swift build
      - name: Unit tests
        run: swift test
      # GUI steps (winecfg/notepad windows) stay MAC-HANDS manual per plan §4 S2.
